<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="app-header">

            <div>
                <p class="label">PRODUCTIVITY</p>

                <h1>TaskFlow</h1>

                <p class="subtitle">
                    Stay organized. Get things done.
                </p>
            </div>

            <div class="task-summary">

                <span id="totalTasks">0</span>

                <small>Total Tasks</small>

            </div>

        </header>


        <!-- Add Task -->
        <section class="task-input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="What needs to be done?"
                autocomplete="off"
            >

            <button id="addTaskBtn">
                Add Task
            </button>

        </section>


        <!-- Filters -->
        <section class="task-controls">

            <div class="filters">

                <button
                    class="filter-btn active"
                    data-filter="all">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="active">
                    Active
                </button>

                <button
                    class="filter-btn"
                    data-filter="completed">
                    Completed
                </button>

            </div>

            <button id="clearCompleted">
                Clear Completed
            </button>

        </section>


        <!-- Task List -->
        <section class="tasks-section">

            <ul id="taskList"></ul>

            <div
                id="emptyState"
                class="empty-state">

                <div class="empty-icon">
                    ✓
                </div>

                <h2>No tasks yet</h2>

                <p>
                    Add a task above to get started.
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer class="app-footer">

            <span id="remainingTasks">
                0 tasks remaining
            </span>

            <span>
                Your tasks are saved automatically.
            </span>

        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
